<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
  <defs>
    <linearGradient id="spaceGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0EBF8"/>
      <stop offset="50%" style="stop-color:#E8E0F0"/>
      <stop offset="100%" style="stop-color:#F0EBF8"/>
    </linearGradient>
    <linearGradient id="milkyWayL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C4B5FD;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#C4B5FD;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#DDD6FE;stop-opacity:0.5"/>
      <stop offset="70%" style="stop-color:#C4B5FD;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#C4B5FD;stop-opacity:0"/>
    </linearGradient>
    <radialGradient id="nebula1L" cx="30%" cy="40%" r="40%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="nebula2L" cx="70%" cy="60%" r="35%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:0"/>
    </radialGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur3"><feGaussianBlur stdDeviation="10"/></filter>
    <radialGradient id="starGlowD" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1E1B4B;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#1E1B4B;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <style>
    @keyframes tw1{0%,100%{opacity:.2}50%{opacity:.7}}
    @keyframes tw2{0%,100%{opacity:.4}50%{opacity:1}}
    @keyframes tw3{0%,100%{opacity:.6}50%{opacity:1}}
    .sf{animation:tw1 3s ease-in-out infinite}
    .sm{animation:tw2 4s ease-in-out infinite}
    .sn{animation:tw3 2.5s ease-in-out infinite}
  </style>

  <rect width="800" height="300" fill="url(#spaceGradL)"/>

  <!-- Milky Way band (light) -->
  <g transform="rotate(-25, 400, 150)">
    <rect x="-100" y="100" width="1000" height="100" fill="url(#milkyWayL)" filter="url(#blur3)"/>
    <rect x="-50" y="120" width="900" height="60" fill="url(#milkyWayL)" opacity="0.6" filter="url(#blur2)"/>
  </g>

  <!-- Nebula clouds (light) -->
  <ellipse cx="200" cy="120" rx="200" ry="80" fill="url(#nebula1L)" filter="url(#blur3)"/>
  <ellipse cx="600" cy="180" rx="220" ry="90" fill="url(#nebula2L)" filter="url(#blur3)"/>

  <!-- Stars - far (dark dots on light bg) -->
  <circle class="sf" cx="30" cy="20" r="1" fill="#6D28D9" opacity="0.4" style="animation-delay:.1s"/>
  <circle class="sf" cx="75" cy="48" r="0.8" fill="#4338CA" opacity="0.35" style="animation-delay:.5s"/>
  <circle class="sf" cx="120" cy="15" r="1.1" fill="#6D28D9" opacity="0.4" style="animation-delay:.9s"/>
  <circle class="sf" cx="168" cy="58" r="0.7" fill="#4338CA" opacity="0.3" style="animation-delay:1.3s"/>
  <circle class="sf" cx="215" cy="25" r="1" fill="#6D28D9" opacity="0.45" style="animation-delay:1.7s"/>
  <circle class="sf" cx="262" cy="72" r="0.8" fill="#4338CA" opacity="0.35" style="animation-delay:2.1s"/>
  <circle class="sf" cx="308" cy="18" r="1.1" fill="#6D28D9" opacity="0.4" style="animation-delay:2.5s"/>
  <circle class="sf" cx="355" cy="55" r="0.7" fill="#4338CA" opacity="0.3" style="animation-delay:2.9s"/>
  <circle class="sf" cx="402" cy="30" r="1" fill="#6D28D9" opacity="0.45" style="animation-delay:3.3s"/>
  <circle class="sf" cx="448" cy="65" r="0.8" fill="#4338CA" opacity="0.35" style="animation-delay:.3s"/>
  <circle class="sf" cx="495" cy="12" r="1.1" fill="#6D28D9" opacity="0.4" style="animation-delay:.7s"/>
  <circle class="sf" cx="542" cy="48" r="0.7" fill="#4338CA" opacity="0.3" style="animation-delay:1.1s"/>
  <circle class="sf" cx="588" cy="22" r="1" fill="#6D28D9" opacity="0.45" style="animation-delay:1.5s"/>
  <circle class="sf" cx="635" cy="60" r="0.8" fill="#4338CA" opacity="0.35" style="animation-delay:1.9s"/>
  <circle class="sf" cx="682" cy="15" r="1.1" fill="#6D28D9" opacity="0.4" style="animation-delay:2.3s"/>
  <circle class="sf" cx="728" cy="50" r="0.7" fill="#4338CA" opacity="0.3" style="animation-delay:2.7s"/>
  <circle class="sf" cx="775" cy="28" r="1" fill="#6D28D9" opacity="0.45" style="animation-delay:3.1s"/>
  <circle class="sf" cx="50" cy="220" r="0.8" fill="#6D28D9" opacity="0.35" style="animation-delay:.4s"/>
  <circle class="sf" cx="180" cy="250" r="1" fill="#4338CA" opacity="0.4" style="animation-delay:1s"/>
  <circle class="sf" cx="320" cy="235" r="0.7" fill="#6D28D9" opacity="0.3" style="animation-delay:1.6s"/>
  <circle class="sf" cx="460" cy="265" r="1.1" fill="#4338CA" opacity="0.45" style="animation-delay:2.2s"/>
  <circle class="sf" cx="600" cy="245" r="0.8" fill="#6D28D9" opacity="0.35" style="animation-delay:2.8s"/>
  <circle class="sf" cx="740" cy="270" r="1" fill="#4338CA" opacity="0.4" style="animation-delay:3.4s"/>

  <!-- Stars - mid -->
  <circle class="sm" cx="90" cy="35" r="2" fill="#6D28D9" opacity="0.6" style="animation-delay:.3s"/>
  <circle class="sm" cx="280" cy="75" r="1.8" fill="#4338CA" opacity="0.55" style="animation-delay:1.2s"/>
  <circle class="sm" cx="480" cy="42" r="2.2" fill="#1E1B4B" opacity="0.6" style="animation-delay:2.1s"/>
  <circle class="sm" cx="680" cy="68" r="1.9" fill="#6D28D9" opacity="0.55" style="animation-delay:3s"/>
  <circle class="sm" cx="180" cy="215" r="2" fill="#4338CA" opacity="0.6" style="animation-delay:.8s"/>
  <circle class="sm" cx="500" cy="240" r="2.1" fill="#1E1B4B" opacity="0.55" style="animation-delay:2.4s"/>
  <circle class="sm" cx="720" cy="225" r="1.8" fill="#6D28D9" opacity="0.5" style="animation-delay:1.5s"/>

  <!-- Stars - near (bigger, darker) -->
  <g class="sn" style="animation-delay:.6s">
    <circle cx="150" cy="50" r="3" fill="#1E1B4B"/>
    <circle cx="150" cy="50" r="10" fill="url(#starGlowD)" opacity="0.3"/>
  </g>
  <g class="sn" style="animation-delay:1.8s">
    <circle cx="430" cy="85" r="3.5" fill="#1E1B4B"/>
    <circle cx="430" cy="85" r="12" fill="url(#starGlowD)" opacity="0.3"/>
  </g>
  <g class="sn" style="animation-delay:2.8s">
    <circle cx="660" cy="42" r="3.2" fill="#1E1B4B"/>
    <circle cx="660" cy="42" r="11" fill="url(#starGlowD)" opacity="0.3"/>
  </g>
</svg>