<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="c1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#A855F7;stop-opacity:.8"/><stop offset="100%" style="stop-color:#0B0D17;stop-opacity:.9"/></linearGradient>
    <linearGradient id="c2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#60A5FA;stop-opacity:.7"/><stop offset="100%" style="stop-color:#0B0D17;stop-opacity:.8"/></linearGradient>
    <linearGradient id="c3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#34D399;stop-opacity:.5"/><stop offset="100%" style="stop-color:#F472B6;stop-opacity:.6"/></linearGradient>
    <filter id="ng"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    @keyframes rc{0%{transform:perspective(800px) rotateX(-5deg) rotateY(0deg)}25%{transform:perspective(800px) rotateX(0deg) rotateY(10deg)}50%{transform:perspective(800px) rotateX(5deg) rotateY(0deg)}75%{transform:perspective(800px) rotateX(0deg) rotateY(-10deg)}100%{transform:perspective(800px) rotateX(-5deg) rotateY(0deg)}}
    @keyframes fb{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @keyframes gp{0%,100%{filter:drop-shadow(0 0 4px #A855F7)}50%{filter:drop-shadow(0 0 12px #A855F7) drop-shadow(0 0 20px #60A5FA)}}
    @keyframes lf{0%{stroke-dashoffset:200}100%{stroke-dashoffset:0}}
    .cg{animation:rc 8s ease-in-out infinite,fb 4s ease-in-out infinite;transform-origin:center}
    .cf{animation:gp 3s ease-in-out infinite}
    .fl{stroke-dasharray:10 5;animation:lf 3s linear infinite}
    .tl{font-family:'Courier New',monospace;font-size:10px;fill:#94A3B8;font-weight:bold}
    .ti{font-size:18px}
  </style>

  <rect width="800" height="200" fill="#0B0D17"/>

  <!-- Flow lines -->
  <line class="fl" x1="120" y1="100" x2="280" y2="55" stroke="#A855F7" stroke-width="1" opacity=".3"/>
  <line class="fl" x1="120" y1="100" x2="280" y2="145" stroke="#60A5FA" stroke-width="1" opacity=".3" style="animation-delay:.3s"/>
  <line class="fl" x1="280" y1="55" x2="400" y2="100" stroke="#A855F7" stroke-width="1" opacity=".3" style="animation-delay:.6s"/>
  <line class="fl" x1="280" y1="145" x2="400" y2="100" stroke="#60A5FA" stroke-width="1" opacity=".3" style="animation-delay:.9s"/>
  <line class="fl" x1="400" y1="100" x2="520" y2="55" stroke="#34D399" stroke-width="1" opacity=".3" style="animation-delay:1.2s"/>
  <line class="fl" x1="400" y1="100" x2="520" y2="145" stroke="#F472B6" stroke-width="1" opacity=".3" style="animation-delay:1.5s"/>
  <line class="fl" x1="520" y1="55" x2="680" y2="100" stroke="#34D399" stroke-width="1" opacity=".3" style="animation-delay:1.8s"/>
  <line class="fl" x1="520" y1="145" x2="680" y2="100" stroke="#F472B6" stroke-width="1" opacity=".3" style="animation-delay:2.1s"/>

  <!-- 3D Cube center -->
  <g class="cg" transform="translate(400,100)">
    <polygon class="cf" points="-40,-30 40,-30 40,30 -40,30" fill="url(#c1)" stroke="#A855F7" stroke-width="1"/>
    <polygon class="cf" points="-40,-30 0,-55 80,-30 40,-30" fill="url(#c2)" stroke="#60A5FA" stroke-width=".5" style="animation-delay:.5s"/>
    <polygon class="cf" points="40,-30 80,-55 80,5 40,30" fill="url(#c3)" stroke="#34D399" stroke-width=".5" style="animation-delay:1s"/>
  </g>

  <!-- Tech nodes -->
  <g transform="translate(120,100)"><circle r="22" fill="#0B0D17" stroke="#A855F7" stroke-width="2"/><text class="ti" x="0" y="5" text-anchor="middle" fill="#A855F7">JS</text><text class="tl" x="0" y="40" text-anchor="middle">JavaScript</text></g>
  <g transform="translate(280,55)"><circle r="20" fill="#0B0D17" stroke="#60A5FA" stroke-width="2"/><text class="ti" x="0" y="5" text-anchor="middle" fill="#60A5FA">TS</text><text class="tl" x="0" y="38" text-anchor="middle">TypeScript</text></g>
  <g transform="translate(280,145)"><circle r="20" fill="#0B0D17" stroke="#34D399" stroke-width="2"/><text class="ti" x="0" y="5" text-anchor="middle" fill="#34D399">R</text><text class="tl" x="0" y="38" text-anchor="middle">React</text></g>
  <g transform="translate(520,55)"><circle r="20" fill="#0B0D17" stroke="#F472B6" stroke-width="2"/><text class="ti" x="0" y="5" text-anchor="middle" fill="#F472B6">N</text><text class="tl" x="0" y="38" text-anchor="middle">Node.js</text></g>
  <g transform="translate(520,145)"><circle r="20" fill="#0B0D17" stroke="#A855F7" stroke-width="2"/><text class="ti" x="0" y="5" text-anchor="middle" fill="#A855F7">Py</text><text class="tl" x="0" y="38" text-anchor="middle">Python</text></g>
  <g transform="translate(680,100)"><circle r="22" fill="#0B0D17" stroke="#60A5FA" stroke-width="2"/><text class="ti" x="0" y="5" text-anchor="middle" fill="#60A5FA">DB</text><text class="tl" x="0" y="40" text-anchor="middle">Database</text></g>
</svg>