<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
  <defs>
    <linearGradient id="spaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B0D17"/>
      <stop offset="50%" style="stop-color:#111328"/>
      <stop offset="100%" style="stop-color:#0B0D17"/>
    </linearGradient>
    <linearGradient id="milkyWay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D1B69;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#2D1B69;stop-opacity:0.4"/>
      <stop offset="50%" style="stop-color:#3B2299;stop-opacity:0.6"/>
      <stop offset="70%" style="stop-color:#2D1B69;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#2D1B69;stop-opacity:0"/>
    </linearGradient>
    <radialGradient id="nebula1" cx="30%" cy="40%" r="40%">
      <stop offset="0%" style="stop-color:#A855F7;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#A855F7;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="70%" cy="60%" r="35%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#60A5FA;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="nebula3" cx="50%" cy="30%" r="30%">
      <stop offset="0%" style="stop-color:#34D399;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#34D399;stop-opacity:0"/>
    </radialGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur3"><feGaussianBlur stdDeviation="10"/></filter>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#F8FAFC;stop-opacity:1"/>
      <stop offset="30%" style="stop-color:#F8FAFC;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#F8FAFC;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="starGlowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#A855F7;stop-opacity:1"/>
      <stop offset="30%" style="stop-color:#A855F7;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#A855F7;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="starGlowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1"/>
      <stop offset="30%" style="stop-color:#60A5FA;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#60A5FA;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <style>
    @keyframes twinkle1{0%,100%{opacity:.15}50%{opacity:.8}}
    @keyframes twinkle2{0%,100%{opacity:.3}50%{opacity:1}}
    @keyframes twinkle3{0%,100%{opacity:.5}50%{opacity:1}}
    @keyframes drift{0%{transform:translate(0,0)}50%{transform:translate(2px,-1px)}100%{transform:translate(0,0)}}
    @keyframes shootingStar{0%{transform:translateX(-60px) translateY(30px);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateX(860px) translateY(-120px);opacity:0}}
    .s-far{animation:twinkle1 3s ease-in-out infinite}
    .s-mid{animation:twinkle2 4s ease-in-out infinite}
    .s-near{animation:twinkle3 2.5s ease-in-out infinite}
    .drift{animation:drift 8s ease-in-out infinite}
    .shoot{animation:shootingStar 7s linear infinite}
  </style>

  <!-- Deep space background -->
  <rect width="800" height="300" fill="url(#spaceGrad)"/>

  <!-- Milky Way diagonal band with depth -->
  <g transform="rotate(-25, 400, 150)">
    <rect x="-100" y="100" width="1000" height="100" fill="url(#milkyWay)" filter="url(#blur3)"/>
    <rect x="-50" y="120" width="900" height="60" fill="url(#milkyWay)" opacity="0.7" filter="url(#blur2)"/>
    <rect x="0" y="135" width="800" height="30" fill="#3B2299" opacity="0.3" filter="url(#blur1)"/>
  </g>

  <!-- Nebula clouds (back layer - most blurred) -->
  <ellipse cx="200" cy="120" rx="200" ry="80" fill="url(#nebula1)" filter="url(#blur3)"/>
  <ellipse cx="600" cy="180" rx="220" ry="90" fill="url(#nebula2)" filter="url(#blur3)"/>
  <ellipse cx="400" cy="80" rx="160" ry="60" fill="url(#nebula3)" filter="url(#blur2)"/>

  <!-- Stars - FAR layer (tiny, many, dim) -->
  <g class="s-far" style="animation-delay:0s"><circle cx="25" cy="15" r="0.5" fill="#F8FAFC" opacity="0.3"/></g>
  <g class="s-far" style="animation-delay:.4s"><circle cx="68" cy="42" r="0.4" fill="#F8FAFC" opacity="0.25"/></g>
  <g class="s-far" style="animation-delay:.8s"><circle cx="112" cy="18" r="0.6" fill="#F8FAFC" opacity="0.3"/></g>
  <g class="s-far" style="animation-delay:1.2s"><circle cx="158" cy="55" r="0.4" fill="#F8FAFC" opacity="0.2"/></g>
  <g class="s-far" style="animation-delay:1.6s"><circle cx="205" cy="22" r="0.5" fill="#F8FAFC" opacity="0.35"/></g>
  <g class="s-far" style="animation-delay:2s"><circle cx="248" cy="68" r="0.3" fill="#F8FAFC" opacity="0.2"/></g>
  <g class="s-far" style="animation-delay:2.4s"><circle cx="295" cy="12" r="0.5" fill="#F8FAFC" opacity="0.3"/></g>
  <g class="s-far" style="animation-delay:2.8s"><circle cx="338" cy="48" r="0.4" fill="#F8FAFC" opacity="0.25"/></g>
  <g class="s-far" style="animation-delay:3.2s"><circle cx="382" cy="28" r="0.6" fill="#F8FAFC" opacity="0.3"/></g>
  <g class="s-far" style="animation-delay:0.2s"><circle cx="428" cy="62" r="0.4" fill="#F8FAFC" opacity="0.2"/></g>
  <g class="s-far" style="animation-delay:0.6s"><circle cx="472" cy="15" r="0.5" fill="#F8FAFC" opacity="0.35"/></g>
  <g class="s-far" style="animation-delay:1s"><circle cx="518" cy="52" r="0.3" fill="#F8FAFC" opacity="0.25"/></g>
  <g class="s-far" style="animation-delay:1.4s"><circle cx="562" cy="20" r="0.5" fill="#F8FAFC" opacity="0.3"/></g>
  <g class="s-far" style="animation-delay:1.8s"><circle cx="608" cy="45" r="0.4" fill="#F8FAFC" opacity="0.2"/></g>
  <g class="s-far" style="animation-delay:2.2s"><circle cx="652" cy="10" r="0.6" fill="#F8FAFC" opacity="0.3"/></g>
  <g class="s-far" style="animation-delay:2.6s"><circle cx="698" cy="38" r="0.4" fill="#F8FAFC" opacity="0.25"/></g>
  <g class="s-far" style="animation-delay:3s"><circle cx="742" cy="55" r="0.5" fill="#F8FAFC" opacity="0.3"/></g>
  <g class="s-far" style="animation-delay:3.4s"><circle cx="785" cy="22" r="0.3" fill="#F8FAFC" opacity="0.2"/></g>
  <g class="s-far" style="animation-delay:.3s"><circle cx="42" cy="85" r="0.4" fill="#F8FAFC" opacity="0.25"/></g>
  <g class="s-far" style="animation-delay:.7s"><circle cx="95" cy="210" r="0.5" fill="#F8FAFC" opacity="0.3"/></g>
  <g class="s-far" style="animation-delay:1.1s"><circle cx="165" cy="245" r="0.4" fill="#F8FAFC" opacity="0.2"/></g>
  <g class="s-far" style="animation-delay:1.5s"><circle cx="235" cy="225" r="0.5" fill="#F8FAFC" opacity="0.35"/></g>
  <g class="s-far" style="animation-delay:1.9s"><circle cx="310" cy="260" r="0.3" fill="#F8FAFC" opacity="0.25"/></g>
  <g class="s-far" style="animation-delay:2.3s"><circle cx="385" cy="238" r="0.5" fill="#F8FAFC" opacity="0.3"/></g>
  <g class="s-far" style="animation-delay:2.7s"><circle cx="460" cy="270" r="0.4" fill="#F8FAFC" opacity="0.2"/></g>
  <g class="s-far" style="animation-delay:3.1s"><circle cx="535" cy="252" r="0.6" fill="#F8FAFC" opacity="0.3"/></g>
  <g class="s-far" style="animation-delay:3.5s"><circle cx="610" cy="278" r="0.4" fill="#F8FAFC" opacity="0.25"/></g>
  <g class="s-far" style="animation-delay:.15s"><circle cx="685" cy="242" r="0.5" fill="#F8FAFC" opacity="0.3"/></g>
  <g class="s-far" style="animation-delay:.55s"><circle cx="760" cy="265" r="0.3" fill="#F8FAFC" opacity="0.2"/></g>

  <!-- Stars - MID layer (medium, some color) -->
  <g class="s-mid drift" style="animation-delay:.2s"><circle cx="80" cy="30" r="1.2" fill="#A855F7" opacity="0.6"/><circle cx="80" cy="30" r="4" fill="url(#starGlowPurple)" opacity="0.3"/></g>
  <g class="s-mid drift" style="animation-delay:.9s"><circle cx="220" cy="70" r="1" fill="#60A5FA" opacity="0.5"/><circle cx="220" cy="70" r="3.5" fill="url(#starGlowBlue)" opacity="0.25"/></g>
  <g class="s-mid drift" style="animation-delay:1.6s"><circle cx="380" cy="40" r="1.3" fill="#F8FAFC" opacity="0.6"/><circle cx="380" cy="40" r="4" fill="url(#starGlow)" opacity="0.3"/></g>
  <g class="s-mid drift" style="animation-delay:2.3s"><circle cx="520" cy="65" r="1.1" fill="#34D399" opacity="0.5"/><circle cx="520" cy="65" r="3.5" fill="url(#starGlow)" opacity="0.25"/></g>
  <g class="s-mid drift" style="animation-delay:3s"><circle cx="680" cy="35" r="1.2" fill="#A855F7" opacity="0.6"/><circle cx="680" cy="35" r="4" fill="url(#starGlowPurple)" opacity="0.3"/></g>
  <g class="s-mid drift" style="animation-delay:.5s"><circle cx="150" cy="200" r="1" fill="#60A5FA" opacity="0.5"/><circle cx="150" cy="200" r="3" fill="url(#starGlowBlue)" opacity="0.25"/></g>
  <g class="s-mid drift" style="animation-delay:1.3s"><circle cx="400" cy="240" r="1.3" fill="#F8FAFC" opacity="0.6"/><circle cx="400" cy="240" r="4" fill="url(#starGlow)" opacity="0.3"/></g>
  <g class="s-mid drift" style="animation-delay:2.1s"><circle cx="620" cy="220" r="1.1" fill="#34D399" opacity="0.5"/><circle cx="620" cy="220" r="3.5" fill="url(#starGlow)" opacity="0.25"/></g>
  <g class="s-mid drift" style="animation-delay:2.8s"><circle cx="750" cy="250" r="1.2" fill="#A855F7" opacity="0.5"/><circle cx="750" cy="250" r="4" fill="url(#starGlowPurple)" opacity="0.25"/></g>

  <!-- Stars - NEAR layer (big, bright, strong glow) -->
  <g class="s-near drift" style="animation-delay:.5s">
    <circle cx="130" cy="55" r="2.5" fill="#F8FAFC"/>
    <circle cx="130" cy="55" r="8" fill="url(#starGlow)" opacity="0.5"/>
    <circle cx="130" cy="55" r="15" fill="url(#starGlow)" opacity="0.15"/>
  </g>
  <g class="s-near drift" style="animation-delay:1.5s">
    <circle cx="450" cy="80" r="3" fill="#A855F7"/>
    <circle cx="450" cy="80" r="10" fill="url(#starGlowPurple)" opacity="0.5"/>
    <circle cx="450" cy="80" r="18" fill="url(#starGlowPurple)" opacity="0.15"/>
  </g>
  <g class="s-near drift" style="animation-delay:2.5s">
    <circle cx="700" cy="45" r="2.8" fill="#60A5FA"/>
    <circle cx="700" cy="45" r="9" fill="url(#starGlowBlue)" opacity="0.5"/>
    <circle cx="700" cy="45" r="16" fill="url(#starGlowBlue)" opacity="0.15"/>
  </g>
  <g class="s-near drift" style="animation-delay:.8s">
    <circle cx="300" cy="230" r="2.2" fill="#F8FAFC"/>
    <circle cx="300" cy="230" r="7" fill="url(#starGlow)" opacity="0.4"/>
  </g>
  <g class="s-near drift" style="animation-delay:2s">
    <circle cx="580" cy="210" r="2.5" fill="#34D399"/>
    <circle cx="580" cy="210" r="8" fill="url(#starGlow)" opacity="0.4"/>
  </g>

  <!-- Shooting stars -->
  <g class="shoot" style="animation-delay:0s">
    <circle cx="0" cy="90" r="2" fill="#F8FAFC"/>
    <line x1="0" y1="90" x2="-50" y2="110" stroke="#F8FAFC" stroke-width="0.8" opacity="0.3"/>
    <line x1="0" y1="90" x2="-30" y2="100" stroke="#A855F7" stroke-width="1.5" opacity="0.7"/>
  </g>
  <g class="shoot" style="animation-delay:3.5s">
    <circle cx="0" cy="150" r="1.5" fill="#60A5FA"/>
    <line x1="0" y1="150" x2="-40" y2="168" stroke="#60A5FA" stroke-width="0.6" opacity="0.25"/>
    <line x1="0" y1="150" x2="-25" y2="158" stroke="#60A5FA" stroke-width="1.2" opacity="0.6"/>
  </g>

  <!-- Constellation lines -->
  <g opacity="0.08" stroke="#A855F7" stroke-width="0.5">
    <line x1="130" y1="55" x1="130" y2="55" x2="220" y2="70"/>
    <line x1="220" y1="70" x2="380" y2="40"/>
    <line x1="380" y1="40" x2="520" y2="65"/>
    <line x1="520" y1="65" x2="680" y2="35"/>
  </g>
</svg>