<svg xmlns="http://www.w3.org/2000/svg" width="800" height="150" viewBox="0 0 800 150">
  <defs>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00E5CC;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00E5CC;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="starGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FF6B6B;stop-opacity:0"/>
    </radialGradient>
  </defs>
  
  <style>
    @keyframes twinkle {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    @keyframes twinkle2 {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.5); }
    }
    @keyframes drift {
      0% { transform: translateX(0) translateY(0); }
      25% { transform: translateX(5px) translateY(-3px); }
      50% { transform: translateX(0) translateY(-5px); }
      75% { transform: translateX(-5px) translateY(-3px); }
      100% { transform: translateX(0) translateY(0); }
    }
    @keyframes shootingStar {
      0% { transform: translateX(-100px) translateY(50px); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateX(900px) translateY(-50px); opacity: 0; }
    }
    @keyframes meteorTrail {
      0% { width: 0; opacity: 0; }
      10% { width: 80px; opacity: 1; }
      90% { width: 80px; opacity: 1; }
      100% { width: 0; opacity: 0; }
    }
    .star {
      animation: twinkle 2s ease-in-out infinite;
      transform-origin: center;
    }
    .star-big {
      animation: twinkle2 3s ease-in-out infinite;
      transform-origin: center;
    }
    .star-drift {
      animation: drift 8s ease-in-out infinite;
    }
    .shooting {
      animation: shootingStar 4s linear infinite;
    }
    .shooting2 {
      animation: shootingStar 5s linear infinite 2s;
    }
  </style>
  
  <!-- Background stars - small -->
  <circle class="star" cx="50" cy="30" r="1" fill="#00E5CC" style="animation-delay: 0s"/>
  <circle class="star" cx="120" cy="60" r="0.8" fill="#E8F4F8" style="animation-delay: 0.3s"/>
  <circle class="star" cx="200" cy="25" r="1.2" fill="#00E5CC" style="animation-delay: 0.6s"/>
  <circle class="star" cx="280" cy="70" r="0.7" fill="#FF6B6B" style="animation-delay: 0.9s"/>
  <circle class="star" cx="350" cy="40" r="1" fill="#E8F4F8" style="animation-delay: 1.2s"/>
  <circle class="star" cx="430" cy="55" r="0.9" fill="#00E5CC" style="animation-delay: 1.5s"/>
  <circle class="star" cx="520" cy="30" r="1.1" fill="#FF6B6B" style="animation-delay: 1.8s"/>
  <circle class="star" cx="600" cy="65" r="0.8" fill="#E8F4F8" style="animation-delay: 2.1s"/>
  <circle class="star" cx="680" cy="35" r="1" fill="#00E5CC" style="animation-delay: 2.4s"/>
  <circle class="star" cx="750" cy="50" r="0.7" fill="#FF6B6B" style="animation-delay: 2.7s"/>
  
  <!-- Big glowing stars -->
  <circle class="star-big star-drift" cx="100" cy="45" r="3" fill="url(#starGlow)" style="animation-delay: 0.5s"/>
  <circle class="star-big star-drift" cx="300" cy="35" r="4" fill="url(#starGlow2)" style="animation-delay: 1s"/>
  <circle class="star-big star-drift" cx="500" cy="50" r="3.5" fill="url(#starGlow)" style="animation-delay: 1.5s"/>
  <circle class="star-big star-drift" cx="700" cy="40" r="3" fill="url(#starGlow2)" style="animation-delay: 2s"/>
  
  <!-- Shooting stars -->
  <g class="shooting">
    <circle cx="0" cy="80" r="2" fill="#00E5CC"/>
    <line x1="0" y1="80" x2="-60" y2="95" stroke="#00E5CC" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="80" x2="-40" y2="88" stroke="#00E5CC" stroke-width="1.5" opacity="0.8"/>
  </g>
  <g class="shooting2">
    <circle cx="0" cy="60" r="1.5" fill="#FF6B6B"/>
    <line x1="0" y1="60" x2="-50" y2="72" stroke="#FF6B6B" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="60" x2="-35" y2="67" stroke="#FF6B6B" stroke-width="1.5" opacity="0.7"/>
  </g>
  
  <!-- Center decoration -->
  <circle cx="400" cy="75" r="20" fill="none" stroke="#00E5CC" stroke-width="0.5" opacity="0.3">
    <animate attributeName="r" values="20;25;20" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="75" r="30" fill="none" stroke="#FF6B6B" stroke-width="0.3" opacity="0.2">
    <animate attributeName="r" values="30;38;30" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="5s" repeatCount="indefinite"/>
  </circle>
</svg>