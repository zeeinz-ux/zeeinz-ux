<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="c1L" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#7C3AED;stop-opacity:.7"/><stop offset="100%" style="stop-color:#F0EBF8;stop-opacity:.8"/></linearGradient>
    <linearGradient id="c2L" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#2563EB;stop-opacity:.6"/><stop offset="100%" style="stop-color:#F0EBF8;stop-opacity:.7"/></linearGradient>
    <linearGradient id="c3L" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#059669;stop-opacity:.4"/><stop offset="100%" style="stop-color:#EC4899;stop-opacity:.5"/></linearGradient>
  </defs>
  <style>
    @keyframes rc{0%{transform:perspective(800px) rotateX(-5deg) rotateY(0deg)}25%{transform:perspective(800px) rotateX(0deg) rotateY(10deg)}50%{transform:perspective(800px) rotateX(5deg) rotateY(0deg)}75%{transform:perspective(800px) rotateX(0deg) rotateY(-10deg)}100%{transform:perspective(800px) rotateX(-5deg) rotateY(0deg)}}
    @keyframes fb{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @keyframes lf{0%{stroke-dashoffset:200}100%{stroke-dashoffset:0}}
    .cg{animation:rc 8s ease-in-out infinite,fb 4s ease-in-out infinite;transform-origin:center}
    .fl{stroke-dasharray:10 5;animation:lf 3s linear infinite}
    .tl{font-family:'Courier New',monospace;font-size:10px;fill:#475569;font-weight:bold}
    .ti{font-size:18px}
  </style>

  <rect width="800" height="200" fill="#F0EBF8"/>

  <!-- Flow lines -->
  <line class="fl" x1="120" y1="100" x2="280" y2="55" stroke="#7C3AED" stroke-width="1" opacity=".2"/>
  <line class="fl" x1="120" y1="100" x2="280" y2="145" stroke="#2563EB" stroke-width="1" opacity=".2" style="animation-delay:.3s"/>
  <line class="fl" x1="280" y1="55" x2="400" y2="100" stroke="#7C3AED" stroke-width="1" opacity=".2" style="animation-delay:.6s"/>
  <line class="fl" x1="280" y1="145" x2="400" y2="100" stroke="#2563EB" stroke-width="1" opacity=".2" style="animation-delay:.9s"/>
  <line class="fl" x1="400" y1="100" x2="520" y2="55" stroke="#059669" stroke-width="1" opacity=".2" style="animation-delay:1.2s"/>
  <line class="fl" x1="400" y1="100" x2="520" y2="145" stroke="#EC4899" stroke-width="1" opacity=".2" style="animation-delay:1.5s"/>
  <line class="fl" x1="520" y1="55" x2="680" y2="100" stroke="#059669" stroke-width="1" opacity=".2" style="animation-delay:1.8s"/>
  <line class="fl" x1="520" y1="145" x2="680" y2="100" stroke="#EC4899" stroke-width="1" opacity=".2" style="animation-delay:2.1s"/>

  <!-- 3D Cube center -->
  <g class="cg" transform="translate(400,100)">
    <polygon points="-40,-30 40,-30 40,30 -40,30" fill="url(#c1L)" stroke="#7C3AED" stroke-width="1"/>
    <polygon points="-40,-30 0,-55 80,-30 40,-30" fill="url(#c2L)" stroke="#2563EB" stroke-width=".5"/>
    <polygon points="40,-30 80,-55 80,5 40,30" fill="url(#c3L)" stroke="#059669" stroke-width=".5"/>
  </g>

  <!-- Tech nodes -->
  <g transform="translate(120,100)"><circle r="22" fill="#F0EBF8" stroke="#7C3AED" stroke-width="2"/><text class="ti" x="0" y="5" text-anchor="middle" fill="#7C3AED">JS</text><text class="tl" x="0" y="40" text-anchor="middle">JavaScript</text></g>
  <g transform="translate(280,55)"><circle r="20" fill="#F0EBF8" stroke="#2563EB" stroke-width="2"/><text class="ti" x="0" y="5" text-anchor="middle" fill="#2563EB">TS</text><text class="tl" x="0" y="38" text-anchor="middle">TypeScript</text></g>
  <g transform="translate(280,145)"><circle r="20" fill="#F0EBF8" stroke="#059669" stroke-width="2"/><text class="ti" x="0" y="5" text-anchor="middle" fill="#059669">R</text><text class="tl" x="0" y="38" text-anchor="middle">React</text></g>
  <g transform="translate(520,55)"><circle r="20" fill="#F0EBF8" stroke="#EC4899" stroke-width="2"/><text class="ti" x="0" y="5" text-anchor="middle" fill="#EC4899">N</text><text class="tl" x="0" y="38" text-anchor="middle">Node.js</text></g>
  <g transform="translate(520,145)"><circle r="20" fill="#F0EBF8" stroke="#7C3AED" stroke-width="2"/><text class="ti" x="0" y="5" text-anchor="middle" fill="#7C3AED">Py</text><text class="tl" x="0" y="38" text-anchor="middle">Python</text></g>
  <g transform="translate(680,100)"><circle r="22" fill="#F0EBF8" stroke="#2563EB" stroke-width="2"/><text class="ti" x="0" y="5" text-anchor="middle" fill="#2563EB">DB</text><text class="tl" x="0" y="40" text-anchor="middle">Database</text></g>
</svg>