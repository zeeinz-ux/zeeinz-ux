<svg xmlns="http://www.w3.org/2000/svg" width="800" height="100" viewBox="0 0 800 100">
  <defs>
    <radialGradient id="g1" cx="50%" cy="50%" r="50%"><stop offset="0%" style="stop-color:#A855F7;stop-opacity:.5"/><stop offset="100%" style="stop-color:#A855F7;stop-opacity:0"/></radialGradient>
    <radialGradient id="g2" cx="50%" cy="50%" r="50%"><stop offset="0%" style="stop-color:#60A5FA;stop-opacity:.5"/><stop offset="100%" style="stop-color:#60A5FA;stop-opacity:0"/></radialGradient>
    <radialGradient id="g3" cx="50%" cy="50%" r="50%"><stop offset="0%" style="stop-color:#34D399;stop-opacity:.5"/><stop offset="100%" style="stop-color:#34D399;stop-opacity:0"/></radialGradient>
  </defs>
  <style>
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
    @keyframes dr{0%{transform:translate(0,0)}50%{transform:translate(2px,-1px)}100%{transform:translate(0,0)}}
    @keyframes sh{0%{transform:translateX(-60px) translateY(25px);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(860px) translateY(-50px);opacity:0}}
    .sf{animation:tw 3s ease-in-out infinite}.sm{animation:tw 4s ease-in-out infinite}.sn{animation:tw 2.5s ease-in-out infinite}
    .dr{animation:dr 6s ease-in-out infinite}.sh1{animation:sh 5s linear infinite}.sh2{animation:sh 7s linear infinite 3s}
  </style>
  <rect width="800" height="100" fill="#0B0D17"/>

  <!-- Stars far -->
  <circle class="sf" cx="25" cy="15" r=".5" fill="#F8FAFC" opacity=".25" style="animation-delay:.1s"/>
  <circle class="sf" cx="72" cy="38" r=".4" fill="#F8FAFC" opacity=".2" style="animation-delay:.5s"/>
  <circle class="sf" cx="118" cy="12" r=".6" fill="#F8FAFC" opacity=".3" style="animation-delay:.9s"/>
  <circle class="sf" cx="165" cy="42" r=".3" fill="#A855F7" opacity=".2" style="animation-delay:1.3s"/>
  <circle class="sf" cx="212" cy="18" r=".5" fill="#F8FAFC" opacity=".25" style="animation-delay:1.7s"/>
  <circle class="sf" cx="258" cy="48" r=".4" fill="#60A5FA" opacity=".2" style="animation-delay:2.1s"/>
  <circle class="sf" cx="305" cy="8" r=".6" fill="#F8FAFC" opacity=".3" style="animation-delay:2.5s"/>
  <circle class="sf" cx="352" cy="35" r=".3" fill="#F8FAFC" opacity=".2" style="animation-delay:2.9s"/>
  <circle class="sf" cx="398" cy="20" r=".5" fill="#34D399" opacity=".25" style="animation-delay:3.3s"/>
  <circle class="sf" cx="445" cy="45" r=".4" fill="#F8FAFC" opacity=".2" style="animation-delay:.3s"/>
  <circle class="sf" cx="492" cy="10" r=".6" fill="#A855F7" opacity=".3" style="animation-delay:.7s"/>
  <circle class="sf" cx="538" cy="38" r=".3" fill="#F8FAFC" opacity=".2" style="animation-delay:1.1s"/>
  <circle class="sf" cx="585" cy="15" r=".5" fill="#60A5FA" opacity=".25" style="animation-delay:1.5s"/>
  <circle class="sf" cx="632" cy="42" r=".4" fill="#F8FAFC" opacity=".2" style="animation-delay:1.9s"/>
  <circle class="sf" cx="678" cy="8" r=".6" fill="#F8FAFC" opacity=".3" style="animation-delay:2.3s"/>
  <circle class="sf" cx="725" cy="32" r=".3" fill="#34D399" opacity=".2" style="animation-delay:2.7s"/>
  <circle class="sf" cx="772" cy="18" r=".5" fill="#F8FAFC" opacity=".25" style="animation-delay:3.1s"/>
  <circle class="sf" cx="48" cy="75" r=".4" fill="#A855F7" opacity=".2" style="animation-delay:.4s"/>
  <circle class="sf" cx="190" cy="80" r=".5" fill="#F8FAFC" opacity=".25" style="animation-delay:1s"/>
  <circle class="sf" cx="340" cy="78" r=".3" fill="#60A5FA" opacity=".2" style="animation-delay:1.6s"/>
  <circle class="sf" cx="480" cy="82" r=".6" fill="#F8FAFC" opacity=".3" style="animation-delay:2.2s"/>
  <circle class="sf" cx="620" cy="76" r=".4" fill="#34D399" opacity=".2" style="animation-delay:2.8s"/>
  <circle class="sf" cx="760" cy="80" r=".5" fill="#F8FAFC" opacity=".25" style="animation-delay:3.4s"/>

  <!-- Stars mid -->
  <circle class="sm dr" cx="100" cy="30" r="1.3" fill="#A855F7" opacity=".5" style="animation-delay:.3s"/>
  <circle class="sm dr" cx="280" cy="55" r="1" fill="#60A5FA" opacity=".45" style="animation-delay:1.2s"/>
  <circle class="sm dr" cx="460" cy="25" r="1.5" fill="#F8FAFC" opacity=".5" style="animation-delay:2.1s"/>
  <circle class="sm dr" cx="640" cy="48" r="1.2" fill="#34D399" opacity=".45" style="animation-delay:3s"/>

  <!-- Stars near -->
  <g class="sn dr" style="animation-delay:.5s"><circle cx="200" cy="40" r="2.5" fill="#A855F7"/><circle cx="200" cy="40" r="8" fill="url(#g1)" opacity=".4"/></g>
  <g class="sn dr" style="animation-delay:1.8s"><circle cx="500" cy="35" r="3" fill="#60A5FA"/><circle cx="500" cy="35" r="10" fill="url(#g2)" opacity=".4"/></g>
  <g class="sn dr" style="animation-delay:3s"><circle cx="700" cy="50" r="2.8" fill="#34D399"/><circle cx="700" cy="50" r="9" fill="url(#g3)" opacity=".4"/></g>

  <!-- Shooting stars -->
  <g class="sh1"><circle cx="0" cy="45" r="2" fill="#F8FAFC"/><line x1="0" y1="45" x2="-50" y2="58" stroke="#F8FAFC" stroke-width=".8" opacity=".3"/><line x1="0" y1="45" x2="-30" y2="52" stroke="#A855F7" stroke-width="1.5" opacity=".6"/></g>
  <g class="sh2"><circle cx="0" cy="65" r="1.5" fill="#60A5FA"/><line x1="0" y1="65" x2="-40" y2="75" stroke="#60A5FA" stroke-width=".6" opacity=".25"/><line x1="0" y1="65" x2="-22" y2="70" stroke="#60A5FA" stroke-width="1.2" opacity=".5"/></g>
</svg>