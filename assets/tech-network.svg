<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="face1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00E5CC;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#040D21;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="face2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#040D21;stop-opacity:0.8"/>
    </linearGradient>
    <linearGradient id="face3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00E5CC;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#FF6B6B;stop-opacity:0.6"/>
    </linearGradient>
  </defs>
  
  <style>
    @keyframes rotateCube {
      0% { transform: perspective(800px) rotateX(-5deg) rotateY(0deg); }
      25% { transform: perspective(800px) rotateX(0deg) rotateY(10deg); }
      50% { transform: perspective(800px) rotateX(5deg) rotateY(0deg); }
      75% { transform: perspective(800px) rotateX(0deg) rotateY(-10deg); }
      100% { transform: perspective(800px) rotateX(-5deg) rotateY(0deg); }
    }
    @keyframes floatBox {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes glowPulse {
      0%, 100% { filter: drop-shadow(0 0 5px #00E5CC); }
      50% { filter: drop-shadow(0 0 15px #00E5CC) drop-shadow(0 0 25px #FF6B6B); }
    }
    @keyframes lineFlow {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    .cube-group {
      animation: rotateCube 8s ease-in-out infinite, floatBox 4s ease-in-out infinite;
      transform-origin: center;
    }
    .cube-face {
      animation: glowPulse 3s ease-in-out infinite;
    }
    .flow-line {
      stroke-dasharray: 10 5;
      animation: lineFlow 3s linear infinite;
    }
    .tech-label {
      font-family: 'Courier New', monospace;
      font-size: 11px;
      fill: #E8F4F8;
      font-weight: bold;
    }
    .tech-icon {
      font-size: 20px;
    }
  </style>
  
  <!-- Connecting lines (neural network style) -->
  <line class="flow-line" x1="120" y1="100" x2="280" y2="60" stroke="#00E5CC" stroke-width="1" opacity="0.4"/>
  <line class="flow-line" x1="120" y1="100" x2="280" y2="140" stroke="#FF6B6B" stroke-width="1" opacity="0.4"/>
  <line class="flow-line" x1="280" y1="60" x2="400" y2="100" stroke="#00E5CC" stroke-width="1" opacity="0.4" style="animation-delay: 0.5s"/>
  <line class="flow-line" x1="280" y1="140" x2="400" y2="100" stroke="#FF6B6B" stroke-width="1" opacity="0.4" style="animation-delay: 0.5s"/>
  <line class="flow-line" x1="400" y1="100" x2="520" y2="60" stroke="#00E5CC" stroke-width="1" opacity="0.4" style="animation-delay: 1s"/>
  <line class="flow-line" x1="400" y1="100" x2="520" y2="140" stroke="#FF6B6B" stroke-width="1" opacity="0.4" style="animation-delay: 1s"/>
  <line class="flow-line" x1="520" y1="60" x2="680" y2="100" stroke="#00E5CC" stroke-width="1" opacity="0.4" style="animation-delay: 1.5s"/>
  <line class="flow-line" x1="520" y1="140" x2="680" y2="100" stroke="#FF6B6B" stroke-width="1" opacity="0.4" style="animation-delay: 1.5s"/>
  
  <!-- 3D Rotating Cube -->
  <g class="cube-group" transform="translate(400, 100)">
    <!-- Front face -->
    <polygon class="cube-face" points="-40,-30 40,-30 40,30 -40,30" fill="url(#face1)" stroke="#00E5CC" stroke-width="1"/>
    <!-- Top face -->
    <polygon class="cube-face" points="-40,-30 0,-55 80,-30 40,-30" fill="url(#face2)" stroke="#FF6B6B" stroke-width="0.5" style="animation-delay: 0.5s"/>
    <!-- Right face -->
    <polygon class="cube-face" points="40,-30 80,-55 80,5 40,30" fill="url(#face3)" stroke="#00E5CC" stroke-width="0.5" style="animation-delay: 1s"/>
  </g>
  
  <!-- Tech nodes -->
  <g transform="translate(120, 100)">
    <circle r="25" fill="#040D21" stroke="#00E5CC" stroke-width="2"/>
    <text class="tech-icon" x="0" y="6" text-anchor="middle">JS</text>
    <text class="tech-label" x="0" y="45" text-anchor="middle">JavaScript</text>
  </g>
  
  <g transform="translate(280, 60)">
    <circle r="22" fill="#040D21" stroke="#FF6B6B" stroke-width="2"/>
    <text class="tech-icon" x="0" y="5" text-anchor="middle">⚛</text>
    <text class="tech-label" x="0" y="40" text-anchor="middle">React</text>
  </g>
  
  <g transform="translate(280, 140)">
    <circle r="22" fill="#040D21" stroke="#00E5CC" stroke-width="2"/>
    <text class="tech-icon" x="0" y="5" text-anchor="middle">▲</text>
    <text class="tech-label" x="0" y="40" text-anchor="middle">Next.js</text>
  </g>
  
  <g transform="translate(520, 60)">
    <circle r="22" fill="#040D21" stroke="#FF6B6B" stroke-width="2"/>
    <text class="tech-icon" x="0" y="5" text-anchor="middle">N</text>
    <text class="tech-label" x="0" y="40" text-anchor="middle">Node.js</text>
  </g>
  
  <g transform="translate(520, 140)">
    <circle r="22" fill="#040D21" stroke="#00E5CC" stroke-width="2"/>
    <text class="tech-icon" x="0" y="5" text-anchor="middle">Py</text>
    <text class="tech-label" x="0" y="40" text-anchor="middle">Python</text>
  </g>
  
  <g transform="translate(680, 100)">
    <circle r="25" fill="#040D21" stroke="#FF6B6B" stroke-width="2"/>
    <text class="tech-icon" x="0" y="6" text-anchor="middle">DB</text>
    <text class="tech-label" x="0" y="45" text-anchor="middle">Database</text>
  </g>
</svg>